<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CCRW Rollcall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, competent SaaS; plain sentence-case words.
   IDEA: a live strength board for 13 groups x 4 units, the one bold element.
   PICTURE: the board on Overview, the arrival banner on Check-in.
   COLOUR and TYPE: cool grey canvas, white work surface, cobalt #2F45FF; green/red/amber only for here/absent/unpaired. Geist throughout.
   LAYOUT: sidebar + inset work panel on laptops, top bar + bottom bar on phones. */
:root{color-scheme:light dark;
  --canvas:light-dark(#f4f4f6,#0b0b0d);--panel:light-dark(#ffffff,#131316);--raised:light-dark(#ffffff,#18181c);
  --ink:light-dark(#18181b,#f4f4f5);--ink2:light-dark(#62626b,#a1a1aa);--ink3:light-dark(#8e8e98,#71717a);
  --line:light-dark(#e6e6ea,#26262b);--line2:light-dark(#efeff2,#1e1e22);--hover:light-dark(#f4f4f6,#1d1d21);
  --brand:#2f45ff;--brand2:light-dark(#eef0ff,#1b1f45);--brandink:light-dark(#2433d6,#9aa6ff);
  --ok:light-dark(#12a150,#3ccf7a);--okbg:light-dark(#e7f7ee,#0f2a1a);--no:light-dark(#e5484d,#ff6b70);--nobg:light-dark(#fdecec,#33161a);
  --warn:light-dark(#b76e00,#f5b546);--warnbg:light-dark(#fff4dc,#30230b);
  --r:10px;--rl:14px;--side:252px;--safe:env(safe-area-inset-bottom,0px);
  --sh:0 1px 2px rgb(16 16 24 / 6%),0 0 0 1px var(--line);--pop:0 12px 40px rgb(16 16 24 / 18%),0 0 0 1px var(--line)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.2}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:13px}.xs{font-size:12px}
.hide{display:none!important}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sp{justify-content:space-between}
.grow{flex:1}

/* controls */
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.input,select.input{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:14px;width:100%;transition:border-color .12s,box-shadow .12s}
.input:focus,select.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:14px;font-weight:550;cursor:pointer;white-space:nowrap;box-shadow:0 1px 1px rgb(16 16 24 / 4%)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgb(47 69 255 / 30%),inset 0 1px 0 rgb(255 255 255 / 15%)}
.btn.primary:hover{background:#2639e6}
.btn.danger{color:var(--no)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.lg{height:44px;padding:0 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:550;background:var(--hover);color:var(--ink2);white-space:nowrap}
.badge.newb{background:var(--brand);color:#fff;font-weight:650}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.no{background:var(--nobg);color:var(--no)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.brand{background:var(--brand2);color:var(--brandink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent);flex:none}
.livedot.off{background:var(--ink3);box-shadow:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;margin-bottom:-1px;font-size:14px;font-weight:550;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tabs .count{font-size:12px;color:var(--ink3);font-weight:500}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:650;background:var(--hover);color:var(--ink2);flex:none}
.av.ok{background:var(--okbg);color:var(--ok)}

/* app frame */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:14px 12px}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.04em;box-shadow:inset 0 1px 0 rgb(255 255 255 / 20%)}
.ws b{font-size:14px;display:block;line-height:1.2}.ws span{font-size:12px;color:var(--ink2)}
.mswitch{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;box-shadow:0 1px 2px rgb(16 16 24 / 4%);margin-bottom:14px}
.mswitch:hover{border-color:var(--ink3)}
.mswitch .t{font-weight:600;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mswitch .s{font-size:12px;color:var(--ink2)}
.nav{display:grid;gap:1px}
.nav .lbl{font-size:12px;color:var(--ink3);padding:14px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current]{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.nav a .n{margin-left:auto;font-size:12px;color:var(--ink3)}
.nav a .n.warn{color:var(--warn);font-weight:600}
.side .foot{margin-top:auto;display:grid;gap:2px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:6px 10px}
.sync .dot{color:var(--ok)}.sync.off .dot{color:var(--no)}.sync.busy .dot{color:var(--warn)}
.main{padding:8px 8px 8px 0;min-width:0}
.panel{background:var(--panel);border-radius:var(--rl);box-shadow:var(--sh);min-height:calc(100dvh - 16px);display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);min-height:62px;position:sticky;top:8px;background:var(--panel);border-radius:var(--rl) var(--rl) 0 0;z-index:5}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;min-width:0}
.crumbs a{color:var(--ink2);font-weight:500}.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink3)}
.head .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink3);font-weight:500}
.page{padding:28px 24px 48px;width:100%;max-width:1240px;margin:0 auto}
.ptitle{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.ptitle h1{font-size:24px;font-weight:650}
.ptitle p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.mob{display:none}

/* cards & sections */
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--rl)}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.card>.ch h2{font-size:14px;font-weight:600}
.card>.cb{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--rl);background:var(--raised);margin-bottom:16px}
.stat{padding:16px 18px;border-left:1px solid var(--line2)}.stat:first-child{border:0}
.stat .l{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.stat .v{font-size:28px;font-weight:650;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.stat .v small{font-size:14px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-left:4px}
.stat .d{font-size:12px;color:var(--ink3);margin-top:4px}
.grid2>.card{display:flex;flex-direction:column}.grid2>.card>.cb{flex:1;display:flex;flex-direction:column}
.chart{flex:1;min-height:200px;display:flex;align-items:flex-end;gap:4px;padding-top:8px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart .c .b{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}.chart .c i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--brand);min-height:2px}
.chart .c.zero i{background:var(--line)}
.chart .c span{font-size:11px;color:var(--ink3);white-space:nowrap}
.chart .c b{font-size:11px;font-weight:600;color:var(--ink2)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.feed li:last-child{border:0}
.feed .w{min-width:0;flex:1}.feed .w b{display:block;font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed .w span{font-size:12px;color:var(--ink2)}

/* strength board — the one bold element */
.board{display:grid;grid-template-columns:minmax(120px,1.1fr) repeat(var(--cols,4),minmax(0,1fr)) minmax(150px,1.4fr);gap:6px;align-items:stretch}
.board .hd{font-size:12px;color:var(--ink3);padding:0 4px 2px;font-weight:500}
.board .gname{display:flex;flex-direction:column;justify-content:center;padding:0 4px;border-radius:8px;cursor:pointer}
.board .gname b{font-size:14px;font-weight:600}.board .gname span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .gname:hover b{color:var(--brandink)}
.cell{height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);background:color-mix(in srgb,var(--brand) calc(var(--p) * .9%),var(--line2));cursor:pointer;border:0;transition:transform .12s}
.cell.hi{color:#fff}
.cell:hover{transform:translateY(-1px);box-shadow:0 0 0 2px var(--brand)}
.cell.none{background:none;border:1px dashed var(--line);color:var(--ink3);cursor:default}.cell.none:hover{transform:none;box-shadow:none}
.cell small{font-weight:500;opacity:.7;margin-left:1px}
.gtot{display:flex;align-items:center;gap:10px;padding:0 6px}
.gtot .bar{flex:1}
.gtot span{font-size:13px;font-weight:600;min-width:56px;text-align:right}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.legend i{width:80px;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--line2),var(--brand))}

/* check-in */
.desk{max-width:760px;margin:0 auto}
.sbox{position:relative}
.sbox .ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink3)}
.sbox input{width:100%;height:60px;border-radius:var(--rl);border:1px solid var(--line);background:var(--raised);padding:0 96px 0 50px;font-size:18px;box-shadow:0 1px 2px rgb(16 16 24 / 5%),0 4px 16px rgb(16 16 24 / 4%)}
.sbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}
.sbox .right{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center}
.sbox .clr{border:0;background:var(--hover);width:28px;height:28px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:16px}
.deskmeta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);margin:10px 2px 0}
.list{list-style:none;margin:16px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--rl);background:var(--raised);overflow:hidden}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2)}
.list>li:first-child{border-top:0}
.list>li.sel{background:var(--brand2)}
.list>li:not(.sel) .btn.primary{background:var(--raised);color:var(--brandink);border-color:color-mix(in srgb,var(--brand) 35%,var(--line));box-shadow:none}.list>li:not(.sel) .btn.primary:hover{background:var(--brand2)}
.list .who{flex:1;min-width:0}
.list .who b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .who .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:13px;color:var(--ink2)}
.list .done{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);font-weight:600}
.banner{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;border-radius:var(--rl);background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.banner .chk{width:36px;height:36px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;flex:none}
.banner .chk .ico{width:20px;height:20px;stroke-width:2.4}
.banner b{display:block;font-size:15px}
.banner .go{font-size:14px;color:var(--ink2)}
.banner .go strong{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.banner{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(-4px)}}}
.addnew{margin-top:16px;padding:16px;border-radius:var(--rl);border:1px dashed var(--line);background:var(--raised)}
.addnew form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;margin-top:12px}
.tip{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink3);font-size:13px;margin-top:28px}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{text-align:left;font-weight:500;font-size:12.5px;color:var(--ink2);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--canvas);white-space:nowrap;position:sticky;top:70px;z-index:1}
.tbl th:first-child{border-top-left-radius:var(--rl)}.tbl th:last-child{border-top-right-radius:var(--rl)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}.tbl tbody tr.click:hover td{background:var(--hover)}
.tbl .r{text-align:right}
.tblwrap{border:1px solid var(--line);border-radius:var(--rl);background:var(--raised)}
.person{display:flex;align-items:center;gap:10px}.person b{font-weight:550}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto}
.sinput{position:relative;flex:1 1 240px;max-width:360px}.sinput .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}.sinput .input{padding-left:34px;width:100%}
.pairsel{display:flex;gap:6px}.pairsel select{height:32px;font-size:13px;padding:0 8px;width:auto;min-width:110px}

/* groups */
.gdetail{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.unit .ch .sub{font-size:12px;color:var(--ink2);font-weight:400;margin-top:2px}
.unit ul{list-style:none;margin:0;padding:6px 0}
.unit li{display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:14px}
.unit li .t{flex:none;font-size:12px;color:var(--ink3);min-width:52px;text-align:right}.unit li .badge{flex:none}
.st{width:8px;height:8px;border-radius:50%;flex:none;background:var(--no)}.st.ok{background:var(--ok)}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--hover);gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:550;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:var(--sh)}

/* reports */
.absgroup{margin-top:18px}
.absgroup h3{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:8px}
.absgroup .ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 24px;border-top:1px solid var(--line2)}
.absgroup .ppl div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line2);font-size:14px}.absgroup .ppl div>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callout{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--hover);font-size:14px;color:var(--ink2);margin-bottom:14px}


/* reports */
.split{height:8px;border-radius:99px;background:var(--no);overflow:hidden;margin-top:10px;opacity:.9}.split i{display:block;height:100%;background:var(--ok)}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.hcard{display:grid;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--rl);background:var(--raised);align-content:start}
a.hcard:hover{border-color:var(--ink3)}
.hcard .hl-l{font-size:12.5px;color:var(--ink2)}
.hcard b{font-size:18px;font-weight:650;letter-spacing:-.01em}
.hcard>span:last-child{font-size:13px;color:var(--ink2)}
.hcard.warn{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.rtbl th{position:static}
.rtbl .grow-row td{background:var(--canvas);border-top:1px solid var(--line)}
.rtbl .grow-row:hover td{background:var(--hover)}
.rtbl .unit-row td{font-size:13.5px;padding-top:7px;padding-bottom:7px}
.rtbl .ind{padding-left:16px;color:var(--ink2)}
.rtbl .gl{display:inline-flex;align-items:center;gap:6px}.rtbl .gl .ico{transition:transform .15s;color:var(--ink3)}.rtbl .open .gl .ico{transform:rotate(180deg)}
.rtbl .tot-row td{border-top:2px solid var(--ink);background:var(--raised)}
.ok-t{color:var(--ok);font-weight:600}.no-t{color:var(--no);font-weight:600}
.rate{display:flex;align-items:center;gap:10px}.rate .badge{min-width:52px;justify-content:center}
.bar i.ok{background:var(--ok)}.bar i.warn{background:#e8a317}.bar i.no{background:var(--no)}
.bar.thin{height:4px}
.legend2{display:flex;gap:6px}
.gsec{border:1px solid var(--line);border-radius:var(--rl);background:var(--raised);margin-bottom:16px;overflow:hidden}
.gsec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--ink);color:var(--panel)}
.gsec-h h2{font-size:16px;font-weight:650}.gsec-h p{margin:2px 0 0;font-size:13px;opacity:.7}
.gsec-s{display:flex;align-items:center;gap:10px;font-size:14px}
.usec-h{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--hover);border-top:1px solid var(--line);font-size:14px}
.ptbl td{padding:8px 16px}.ptbl .stc{white-space:nowrap;width:1%}.ptbl .stc .small{margin-right:8px}
.ptbl tr.is-ok td{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
.ptbl tr.is-no td:first-child b{font-weight:500}
@media print{.hl,.split{break-inside:avoid}.gsec{break-inside:auto}.gsec-h{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* leaders */
.leadcard{margin-bottom:16px}
.leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;padding:12px 16px}
.lead{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}.lead:hover{background:var(--hover)}
.lead b{display:block;font-size:14px;font-weight:600}.lead span span{font-size:12px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.chip2{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 10px;border-radius:8px;background:var(--brand2);color:var(--brandink);font-weight:550;font-size:13px}
.chip2 button{border:0;background:none;color:inherit;width:22px;height:22px;border-radius:6px;cursor:pointer;display:grid;place-items:center}.chip2 button:hover{background:rgb(0 0 0 / 8%)}.chip2 .ico{width:13px;height:13px}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.chk{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-weight:500;cursor:pointer}
.chk:has(input:checked){border-color:var(--brand);background:var(--brand2);color:var(--brandink)}
.chk input{accent-color:var(--brand);margin:0}

/* removing people */
.unit li .rm{flex:none;border:0;background:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink3);cursor:pointer;opacity:0;margin-right:-6px}
.unit li:hover .rm,.unit li .rm:focus-visible{opacity:1}.unit li .rm:hover{background:var(--nobg);color:var(--no)}.unit li .rm .ico{width:14px;height:14px}
@media (hover:none){.unit li .rm{opacity:.6}}
.pick{width:16px;height:16px;accent-color:var(--brand);margin:0;cursor:pointer;vertical-align:middle}
.tbl tr.picked td{background:var(--brand2)}
.bulk{position:fixed;left:50%;bottom:calc(20px + var(--safe));transform:translateX(-50%);z-index:45;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:12px;background:var(--panel);box-shadow:var(--pop);max-width:calc(100vw - 24px)}
.bulk select{height:32px;width:auto;font-size:13px}
body:has(#bulk) .toast{bottom:calc(84px + var(--safe))}
.mlist2{border:1px solid var(--line);border-radius:var(--r);max-height:240px;overflow:auto}
.mrow{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 12px;border-top:1px solid var(--line2);font-weight:500}.mrow:first-child{border:0}
.mrow.gone>span:first-child{text-decoration:line-through;color:var(--ink3)}
@media (max-width:860px){.bulk{bottom:calc(84px + var(--safe))}body:has(#bulk) .toast{bottom:calc(148px + var(--safe))}}

/* empty */
.hday{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 0 6px}.hday:first-child{margin-top:4px}
.hlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--rl);background:var(--raised)}
.hlist li{display:flex;gap:14px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line2)}.hlist li:last-child{border:0}
.hlist .t{flex:none;width:64px;font-size:12px;color:var(--ink3);padding-top:2px}
.hlist .xhb{flex:1;min-width:0;display:grid;gap:3px}
.hlist .xhl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hlist .xhl b,.hlist .linkbtn{font-size:14px;font-weight:600}
.hlist .xhw{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}.hlist .xhw b{color:var(--ink);font-weight:600}
.hlist .xhf{display:inline-block;min-width:48px;font-size:12px;color:var(--ink3)}.hlist s.hold{color:var(--no);text-decoration-thickness:1px}
.hlist .hd2{flex:none;max-width:160px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);cursor:pointer;text-align:left;font:inherit}.linkbtn:hover{color:var(--brandink);text-decoration:underline}
@media (max-width:640px){.hlist li{flex-wrap:wrap;gap:4px 10px}.hlist .t{width:auto}.hlist .xhb{flex-basis:100%;order:3}.hlist .hd2{margin-left:auto}}

.dupw{flex:1;min-width:0}.dupw .linkbtn{font-weight:600;font-size:14px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink2);font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--ink3);color:var(--ink)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px 10px;margin:0 0 14px;padding:12px;border:1px solid var(--line);border-radius:var(--rl);background:var(--raised)}
.fsel{display:grid;gap:3px;min-width:0}.fsel span{font-size:11.5px;color:var(--ink3);padding-left:2px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgb(10 10 14 / 40%);z-index:50;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(440px,calc(100vw - 16px));background:var(--panel);border-radius:var(--rl);box-shadow:var(--pop);z-index:51;display:flex;flex-direction:column}

.drawer .dh .x{margin-left:auto}
.drawer .db{padding:20px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}

.mlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r)}
.mlist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2);font-size:14px}.mlist li:first-child{border:0}
@media (prefers-reduced-motion:no-preference){.drawer:not(.center){animation:slide .2s ease-out}.drawer.center{animation:pop .15s ease-out}@keyframes slide{from{transform:translateX(16px);opacity:.5}}@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}}
.toast{position:fixed;bottom:calc(20px + var(--safe));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;background:var(--ink);color:var(--panel);border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--pop);max-width:calc(100vw - 24px)}
.toast button{border:0;background:rgb(255 255 255 / 15%);color:inherit;height:28px;padding:0 10px;border-radius:6px;font-weight:600;cursor:pointer}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login .card{width:min(400px,100%);padding:28px;box-shadow:var(--pop);border:0}
.login h1{font-size:20px;font-weight:650;margin:18px 0 4px}
.login form{display:grid;gap:12px;margin-top:20px}

@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line2)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}

  .desk-only{display:none!important}
  .mob{display:flex}
  .page{padding:20px 16px 32px}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe))}
  .bnav a,.bnav button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:550;color:var(--ink3);padding:4px 0;border:0;background:none;cursor:pointer}
  .bnav .ico{width:20px;height:20px}
  .bnav [aria-current]{color:var(--ink)}
  .bnav .primary{color:#fff}.bnav .primary span:first-child{width:46px;height:34px;border-radius:12px;background:var(--brand);display:grid;place-items:center;box-shadow:0 2px 8px rgb(47 69 255 / 35%)}
  .bnav .primary span:last-child{color:var(--ink)}
  .tbl th{top:56px}
  .toast{bottom:calc(84px + var(--safe))}
  .drawer,.drawer.center{top:auto;left:0;right:0;bottom:0;transform:none;width:100%;max-height:92dvh;border-radius:18px 18px 0 0}
  .drawer .df{padding-bottom:calc(14px + var(--safe))}
  @media (prefers-reduced-motion:no-preference){.drawer,.drawer.center{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:12px 14px}.stat .v{font-size:22px}
  .board{grid-template-columns:minmax(74px,1fr) repeat(var(--cols,4),minmax(0,1fr));gap:4px}.board .gname span{display:none}.board .gtot,.board .tot-h{display:none}
  .cell{height:40px;font-size:12px}.cell small{display:none}
  .addnew form{grid-template-columns:minmax(0,1fr)}
  .sbox input{height:54px;font-size:17px}
  .hide-sm{display:none}
  .tbl td,.tbl th{padding:10px}
  .two{grid-template-columns:minmax(0,1fr)}
  .pairsel{flex-wrap:wrap}
  .card>.ch{flex-wrap:wrap}.seg button{white-space:nowrap}.rate .bar{display:none}.rate{justify-content:flex-end}
  .hl{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hcard{padding:12px}.hcard b{font-size:16px}
  .gsec-h{padding:12px}.ptbl td{padding:8px 12px}.usec-h{padding:8px 12px}
}
@media print{.side,.head,.bnav,.toast,.toolbar,.tabs,.btn{display:none!important}.app{display:block}.main{padding:0}.panel{box-shadow:none}body{background:#fff}}

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', year:'numeric'}) : '';
const fmtShort = d => d ? new Date(d + 'T12:00').toLocaleDateString([], {day:'numeric', month:'short'}) : '';
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const byName = (a,b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
const I = (n, cls='') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
let canWrite = true, ready = false, downloads = true;
const S = {members:{}, groups:{}, meetings:{}, current:null, notdup:{}};
const store = {get(k,d){ try { const v = localStorage.getItem('ccrw.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem('ccrw.'+k, JSON.stringify(v)); } catch(e){} }};
let pass = store.get('pass', ''), queue = store.get('queue', []), cursor = 0, online = true;
{ const c = store.get('cache', null); if (c && pass && c.v === 3) { Object.assign(S, c.S); S.notdup ||= {}; cursor = c.cursor || 0; ready = true; } }
const persist = () => { store.set('queue', queue); store.set('cache', {v: 3, S, cursor}); };

/* ---------- server sync ---------- */
// On Cloudflare (or locally) the API lives on the same site. Any other host, such as Vercel, calls the Worker directly.
const WORKER = 'https://ccrw.jonmidas27.workers.dev';
const API = /\.workers\.dev$|^localhost$|^127\./.test(location.hostname) ? '/api' : WORKER + '/api';
async function api(path, opts = {}){
  const r = await fetch(API + path, {...opts, headers:{'content-type':'application/json', 'x-passcode': pass, 'x-device': encodeURIComponent(store.get('device', '') || 'Unnamed device')}});
  const body = await r.json().catch(()=>({}));
  if (r.status === 401 || r.status === 429) throw {auth:true, msg: body.error || 'Wrong passcode.'};
  if (!r.ok) throw new Error(body.error || 'Request failed');
  return body;
}
function setOnline(v){ online = v; syncBadge(); }
function syncBadge(){
  const st = !online ? 'off' : queue.length ? 'busy' : '';
  const txt = !online ? `Offline${queue.length?`, ${queue.length} waiting`:''}` : queue.length ? 'Saving…' : 'All changes saved';
  document.querySelectorAll('.syncslot').forEach(el => { el.className = 'sync syncslot ' + st; el.innerHTML = `<span class="dot"></span><span>${txt}</span>`; });
}
function enqueue(op){ op.at = Date.now(); queue.push(op); persist(); syncBadge(); flush(); }
let flushing = false;
async function flush(){
  if (flushing || !queue.length || !pass) return; flushing = true;
  try { while (queue.length) { const batch = queue.slice(0, 400); await api('/ops', {method:'POST', body: JSON.stringify({ops: batch})}); queue.splice(0, batch.length); persist(); } setOnline(true); }
  catch(e){ if (e.auth) lock(e.msg); else setOnline(false); }
  finally { flushing = false; syncBadge(); }
}
function apply(d){
  let changed = false;
  for (const g of d.groups) { changed = true; if (g.deleted) delete S.groups[g.id]; else { let L = []; try { L = JSON.parse(g.leaders || '[]'); } catch(e) {} S.groups[g.id] = {id:g.id, name:g.name, parent:g.parent||'', leaders: Array.isArray(L) ? L : []}; } }

function register(id){
  const m = meeting(); if (!m || m.endedAt || !S.members[id]) return;
  if (!presentMap(m)[id]) { const at = Date.now(); m.present = {...m.present, [id]: at}; enqueue({t:'checkin', op:'put', data:{meeting: S.current, member: id, at}}); }
  ui.last = id; ui.q = ''; ui.sel = 0;
  if ($('.drawer')) { closePanel(); toast(`${S.members[id].name} is checked in.`); }
  const q = $('#q'); if (q) { q.value = ''; q.focus(); }
  render();
}
function unregister(id){ const m = meeting(); if (!m) return; m.present = {...m.present, [id]: null}; enqueue({t:'checkin', op:'del', data:{meeting: S.current, member: id}}); if (ui.last === id) ui.last = null; if ($('.drawer')) closePanel(); render(); toast(`Check-in undone for ${S.members[id]?.name || 'that person'}.`); }
function unpairedGroup(){
  let g = Object.values(S.groups).find(x => !x.parent && isUnp(x));

}
function unpair(ids){

}

function setHead(gid, role, memberId){

    const inScope = role === 'group_head' ? m.group === gid : m.subgroup === gid;
    if (inScope && m.role === role && m.id !== memberId) { m.role = 'member'; saveMember(m); }
  }

    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX); s.onerror = bad; document.head.appendChild(s); });
}
async function readFile(file){
  let grid;
  if (/\.xlsx?$/i.test(file.name)) { const X = await loadXlsx(); const wb = X.read(await file.arrayBuffer()); grid = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''}); }
  else grid = parseCsv(await file.text());
  grid = grid.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  // the header row is the first row that names a "name" column
  const hi = grid.findIndex(r => r.some(c => /name/i.test(c)));
  if (hi < 0 || grid.length - hi < 2) throw new Error('noname');
  grid = grid.slice(hi);
  const H = grid[0].map(norm), find = (...tests) => H.findIndex(h => tests.some(t => t(h)));
  const has = w => h => h.includes(w);
  const iFirst = find(h => /first ?name|given/.test(h)), iLast = find(h => /(last|sur) ?name|family/.test(h));
  const iName = find(h => h==='name'||h==='full name'||h==='names', h => h.includes('name') && !/first|last|sur|group/.test(h));
  const iPhone = find(has('phone'), has('mobile'), has('tel'), has('contact'), has('whatsapp'));
  const iSub = find(h => /sub ?-?group|subgroup/.test(h), has('cell'), has('unit'), has('sub'));
  const iGroup = find(h => !/sub|status/.test(h) && /group|department|dept|team|zone|ministry|fellowship/.test(h));
  const iRole = find(has('role'), has('position'), has('head'), has('leader'), has('title'));
  if (iName < 0 && iFirst < 0) throw new Error('noname');
  const rows = grid.slice(1).map(r => {
    const name = iName >= 0 ? r[iName] : [r[iFirst], iLast >= 0 ? r[iLast] : ''].filter(Boolean).join(' ');
    const role = norm(iRole >= 0 ? r[iRole] : '');
    return {name: name.replace(/\s+/g,' ').trim(), phone: iPhone >= 0 ? r[iPhone].replace(/^[—-]$/,'') : '', group: iGroup >= 0 ? r[iGroup] : '', subgroup: iSub >= 0 ? r[iSub] : '',
      role: /assist/.test(role) ? 'assistant_head' : /sub|unit/.test(role) && /head|leader|lead/.test(role) ? 'subgroup_head' : /head|leader|lead|coordinator/.test(role) ? 'group_head' : 'member'};
  }).filter(r => r.name && !/^(group|section)\b.*\(\d+/i.test(r.name));
  const digitsKey = s => String(s||'').replace(/\D/g,'').slice(-10);
  const key = r => norm(r.name) + '|' + digitsKey(r.phone);
  const havePhones = new Set(Object.values(S.members).flatMap(m => (m.phone||'').split(',').map(digitsKey).filter(p => p.length >= 10)));
  const have = new Set(Object.values(S.members).map(key));
  const seen = new Set(); let dupes = 0;
  for (const r of rows) { const k = key(r), pk = digitsKey(r.phone); r.dupe = have.has(k) || seen.has(k) || (pk.length >= 10 && havePhones.has(pk)); if (r.dupe) dupes++; seen.add(k); }
  const gNames = new Set(rows.filter(r => !r.dupe).map(r => norm(r.group)).filter(Boolean));
  const newGroups = [...gNames].filter(n => !groupsTop().some(g => norm(g.name) === n)).length;
  const cols = [['Name', iName >= 0 || iFirst >= 0], ['Phone', iPhone >= 0], ['Group', iGroup >= 0], ['Unit', iSub >= 0], ['Role', iRole >= 0]].filter(c => c[1]).map(c => c[0]).join(', ');
  return {file: file.name, rows, dupes, newGroups, cols};
}

/* ---------- possible duplicates ---------- */
// People who share a phone number, or have the same name once titles are dropped, are grouped for review.
const TITLE_RE = /^(pst|pastor|rev|reverend|apst|apstl|apost|apostle|ap|evang|evangelist|evg|mrs|mr|dr|prof|hon|sis|bro|elder|eld|min|minister|deac|deacon|barr|prophet|past|amb)\.?\s+/i;
const phoneKeys = p => (p.phone || '').split(',').map(x => x.replace(/\D/g, '')).filter(d => d.length >= 10).map(d => d.slice(-10));
const nameKey = p => { let n = norm(p.name).replace(/\(.*?\)/g, ' '); for (let i = 0; i < 3; i++) n = n.replace(TITLE_RE, ''); const w = n.split(/[^a-z0-9]+/).filter(Boolean).sort(); return w.length >= 2 ? w.join(' ') : ''; };
const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
const notDup = (a, b) => !!(S.notdup || {})[pairKey(a, b)];
let dupCache = {sig: '', list: []};
function dupClusters(){
  const all = Object.values(S.members), sig = all.length + ':' + Object.keys(S.notdup || {}).length + ':' + (cursor || 0);
  if (dupCache.sig === sig) return dupCache.list;
  const byKey = new Map(), add = (k, id) => { if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(id); };
  for (const p of all) { for (const k of phoneKeys(p)) add('p:' + k, p.id); const nk = nameKey(p); if (nk) add('n:' + nk, p.id); }
  const parent = {}, find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  const reasons = {};
  for (const [k, ids] of byKey) {
    const uniq = [...new Set(ids)]; if (uniq.length < 2) continue;
    for (let i = 0; i < uniq.length; i++) for (let j = i + 1; j < uniq.length; j++) {
      const a = uniq[i], b = uniq[j]; if (notDup(a, b)) continue;
      parent[a] ??= a; parent[b] ??= b; parent[find(a)] = find(b);
      (reasons[a] ||= new Set()).add(k); (reasons[b] ||= new Set()).add(k);
    }
  }
  const groups = new Map();
  for (const id of Object.keys(parent)) { const r = find(id); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(S.members[id]); }
  const list = [...groups.values()].filter(g => g.length > 1).map(people => {
    const keys = new Set(people.flatMap(p => [...(reasons[p.id] || [])]));
    const why = [...keys].map(k => k.startsWith('p:') ? 'Same phone number' : 'Same name');
    // suggest keeping whoever is already in a group, then whoever was on the register first
    people.sort((a, b) => (isPaired(b) - isPaired(a)) || ((a.createdAt || 0) - (b.createdAt || 0)) || byName(a, b));
    return {people, why: [...new Set(why)], newest: Math.max(...people.map(p => p.createdAt || 0))};
  }).sort((a, b) => b.newest - a.newest);
  dupCache = {sig, list};
  return list;
}
function dupBody(){
  const q = norm(ui.dq), digits = ui.dq.replace(/\D/g, '');
  let list = dupClusters();
  if (q) list = list.filter(c => c.people.some(p => norm(p.name).includes(q) || (digits.length >= 3 && (p.phone || '').replace(/\D/g, '').includes(digits))));
  if (!list.length) return `<div class="empty"><h2>${q ? 'No one matches' : 'No possible duplicates'}</h2><p>${q ? 'Try another name or number.' : 'People who share a phone number or a name will show up here.'}</p></div>`;
  const pres = presentMap(meeting());
  return `<p class="small muted" style="margin:0 0 12px">Check each set. Choose who to keep. Their group stays, and the others' check-ins and phone numbers move to them before the others are removed.</p>`
    + list.slice(0, ui.dlimit).map(c => `<section class="card dupc"><div class="duph"><b>${c.why.join(' and ')}</b><button class="btn sm ghost" data-act="notDup" data-ids="${c.people.map(p => p.id).join(',')}">Not the same person</button></div>
      <ul class="dupl">${c.people.map((p, i) => `<li><div class="dupw"><button class="linkbtn" data-act="editP" data-id="${p.id}">${esc(p.name)}</button>
        <div class="row" style="gap:6px;margin-top:4px">${whereBadge(p)}${roleBadge(p.role)}${pres[p.id] ? '<span class="badge ok"><span class="dot"></span>Here</span>' : ''}</div>
        <div class="small muted" style="margin-top:4px">${esc(p.phone || 'No phone number')} · ${p.createdAt ? 'Added at a desk ' + (dayLabel(p.createdAt) === 'Today' ? 'today, ' + fmtTime(p.createdAt) : dayLabel(p.createdAt)) : 'On the register from the import'}</div></div>
        <button class="btn sm ${i === 0 ? 'primary' : ''}" data-act="keepDup" data-id="${p.id}" data-ids="${c.people.map(x => x.id).join(',')}">Keep this one</button></li>`).join('')}</ul></section>`).join('')

}
function mergePeople(keepId, dropIds){
  const k = S.members[keepId]; if (!k) return;
  const leaderEdits = new Set();
  for (const id of dropIds) {
    const d = S.members[id]; if (!d || id === keepId) continue;
    // phone numbers: keep every distinct number, the kept person's first
    const seen = new Set(phoneKeys(k)), extra = (d.phone || '').split(',').map(x => x.trim()).filter(x => { const dg = x.replace(/\D/g, ''); const key = dg.length >= 10 ? dg.slice(-10) : dg; if (!dg || seen.has(key)) return false; seen.add(key); return true; });
    if (extra.length) k.phone = [k.phone, ...extra].filter(Boolean).join(', ');
    if (!isPaired(k) && isPaired(d)) { k.group = d.group; k.subgroup = d.subgroup; if (k.role === 'member') k.role = d.role; }
    // someone already on the register isn't a first-timer
    if (!d.joinedMeeting || !k.joinedMeeting) k.joinedMeeting = '';
    if (d.createdAt && k.createdAt && d.createdAt < k.createdAt) k.createdAt = d.createdAt;
    for (const g of Object.values(S.groups)) if ((g.leaders || []).includes(id)) { g.leaders = [...new Set(g.leaders.map(x => x === id ? keepId : x))]; leaderEdits.add(g.id); }
    for (const [mid, mt] of Object.entries(S.meetings)) {
      const t = mt?.present?.[id]; if (!t) continue;
      if (!mt.present[keepId] || t < mt.present[keepId]) { mt.present = {...mt.present, [keepId]: t}; enqueue({t:'checkin', op:'put', data:{meeting: mid, member: keepId, at: t}}); }
      mt.present = {...mt.present, [id]: null}; enqueue({t:'checkin', op:'del', data:{meeting: mid, member: id}});
    }
    delete S.members[id]; ui.sel2.delete(id);
    enqueue({t:'member', op:'del', data:{id, mergedInto: keepId, mergedName: k.name}});
  }
  saveMember(k);
  for (const gid of leaderEdits) saveGroup(S.groups[gid]);
}
function keepDup(keepId, ids){
  const k = S.members[keepId], others = ids.filter(x => x !== keepId && S.members[x]);
  if (!k || !others.length) return;
  const names = others.map(x => esc(S.members[x].name)).join(', ');
  confirmPanel(`Keep ${esc(k.name)}?`, `${names} will be merged into ${esc(k.name)}, who stays in ${esc(where(k))}${!isPaired(k) && others.some(x => isPaired(S.members[x])) ? ' (or takes the group from the merged record)' : ''}. Check-ins and phone numbers move across, then ${others.length === 1 ? 'the other record is' : 'the other records are'} removed. The Changes page records the merge.`, 'Merge', () => {
    mergePeople(keepId, others); render(); toast(`Merged into ${k.name}.`);
  }, false);
}
function dismissDup(ids){
  S.notdup ||= {};
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { const key = pairKey(ids[i], ids[j]); S.notdup[key] = 1; enqueue({t:'notdup', op:'put', data:{pair: key}}); }
  persist(); render(); toast('Marked as different people.');
}

// All filters combine (AND) with each other and with the search box.
const F0 = {att:'any', mt:'', grp:'any', unit:'any', role:'any', origin:'any', phone:'any', hist:'any'};
ui.f = {...F0};
const meetingsList = () => Object.entries(S.meetings).filter(([, v]) => v && v.title).sort((a, b) => (b[1].date || '').localeCompare(a[1].date || '') || (b[1].createdAt || 0) - (a[1].createdAt || 0));

let attCache = {sig: '', n: {}};
function attendedCount(id){
  const ms = meetingsList(), sig = ms.length + ':' + (cursor || 0) + ':' + ms.reduce((s, [, v]) => s + Object.keys(v.present || {}).length, 0);
  if (attCache.sig !== sig) { const n = {}; for (const [, v] of ms) for (const [k, t] of Object.entries(v.present || {})) if (t) n[k] = (n[k] || 0) + 1; attCache = {sig, n}; }
  return attCache.n[id] || 0;
}
const ROLE_F = {
  leaders: p => isLeader(p),
  supervisors: p => isSupervisor(p),
  group_leaders: p => leadsGroups(p).length > 0,
  unit_heads: p => p.role === 'subgroup_head',
  assistants: p => p.role === 'assistant_head',
  members: p => !isLeader(p),

function filterPeople(list){
  const f = ui.f, mid = fMeeting(), pres = mid ? presentMap(S.meetings[mid]) : {};

    (f.att === 'any' || (f.att === 'here' ? !!pres[p.id] : !pres[p.id])) &&
    (f.grp === 'any' || (f.grp === 'unp' ? !isPaired(p) : f.grp === 'sup' ? isSupervisor(p) : p.group === f.grp)) &&
    (f.grp === 'any' || f.grp === 'unp' || f.unit === 'any' || (f.unit === 'none' ? !S.groups[p.subgroup] : p.subgroup === f.unit)) &&
    (f.role === 'any' || ROLE_F[f.role](p)) &&
    (f.origin === 'any' || (f.origin === 'new' ? isNew(p) : f.origin === 'desk' ? !!p.createdAt : !p.createdAt)) &&
    (f.phone === 'any' || (f.phone === 'has' ? phoneKeys(p).length > 0 : f.phone === 'none' ? !(p.phone || '').replace(/\D/g, '') : sharedPhone(p))) &&
    (f.hist === 'any' || (f.hist === 'never' ? attendedCount(p.id) === 0 : f.hist === 'once' ? attendedCount(p.id) === 1 : attendedCount(p.id) >= 2)));
}
let phoneCache = {sig: '', n: {}};
function sharedPhone(p){
  const sig = Object.keys(S.members).length + ':' + (cursor || 0);
  if (phoneCache.sig !== sig) { const n = {}; for (const m of Object.values(S.members)) for (const k of new Set(phoneKeys(m))) n[k] = (n[k] || 0) + 1; phoneCache = {sig, n}; }

window.addEventListener('hashchange', () => { closePanel(); if (route().n !== 'directory') { ui.sel2.clear(); $('#bulk')?.remove(); } render(); document.querySelector('.panel')?.scrollIntoView?.({block:'start'}); scrollTo(0, 0); });

/* ---------- start ---------- */
render();
pull();
setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 3000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
window.addEventListener('online', pull);
}
</script>
