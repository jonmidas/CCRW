<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>CCRW Rollcall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, fast registration desk — plain words, big targets, nothing in the way.
   IDEA: the church's printed attendance register, made live: a strict left edge, big tallies, ticks.
   PICTURE: the working check-in list itself; the arrival card that says where to send someone.
   COLOUR and TYPE: white, ink, one signal red for "not here" and focus; Archivo wide 800 for numbers.
   LAYOUT: sidebar on laptops, bottom tabs on phones; one job per screen, edits in sheets. */
:root{color-scheme:light dark;
  --bg:light-dark(#fff,#0d0d0e);--ink:light-dark(#0c0c0d,#f2f2f3);--ink2:light-dark(#55575c,#a3a5ab);
  --line:light-dark(#e6e7ea,#26272b);--soft:light-dark(#f4f5f7,#17181b);--soft2:light-dark(#eceef1,#1f2024);
  --red:#e4002b;--redsoft:light-dark(#fdecef,#2a1015);--ok:light-dark(#0c0c0d,#f2f2f3);
  --r:14px;--side:244px;--bar:64px;--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.wide{font-stretch:115%;font-weight:800;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink2)}.small{font-size:14px}.tiny{font-size:13px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* controls */
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
input,select{font-size:16px;min-height:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--ink)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:650;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:12px}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.stack{display:grid;gap:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;min-height:40px;padding:6px 16px;border-radius:9px;font-weight:650;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px #0002}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:650;background:var(--soft2);white-space:nowrap}
.chip.head{background:var(--ink);color:var(--bg)}
.chip.unp{background:var(--redsoft);color:var(--red)}
.card{border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg)}
.bar{height:8px;background:light-dark(#dfe1e6,#2c2d32);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:40px 16px}
.empty svg{width:min(320px,80%);height:auto;margin-bottom:8px}
.empty h2{margin:0;font-size:24px}
.note{background:var(--soft);border-radius:12px;padding:14px 16px}
.note.warn{background:var(--redsoft)}

/* shell */
.app{min-height:100dvh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:0;height:100dvh;border-right:1.5px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand .mark{width:42px;height:42px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:11px;letter-spacing:.04em;font-stretch:90%;flex:none}
.brand b{display:block;line-height:1.1}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:10px;text-decoration:none;font-weight:650;color:var(--ink2)}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current]{background:var(--soft2);color:var(--ink)}
.nav a[aria-current]::before{content:"";width:4px;height:20px;border-radius:4px;background:var(--red);margin:-2px 0 -2px -6px}
.nav a span:first-child{flex:1}
.nav .n{font-size:13px;color:var(--ink2);font-weight:600}
.side .foot{margin-top:auto;display:grid;gap:8px;padding:0 6px}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:#1a9e55;flex:none}
.dot.off{background:var(--red)}.dot.busy{background:#d89a00}
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px clamp(16px,3vw,36px);min-height:72px}
.meet{display:flex;align-items:center;gap:12px;border:0;background:none;padding:6px 10px 6px 6px;margin-left:-6px;border-radius:12px;cursor:pointer;text-align:left;min-width:0}
.meet:hover{background:var(--soft)}
.meet .t{font-weight:750;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meet .s{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.meet .caret{width:10px;height:10px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg) translateY(-3px);flex:none}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}
.live.ended i{background:var(--ink2);animation:none}
@keyframes pulse{50%{opacity:.35}}
.count{margin-left:auto;text-align:right;line-height:1.05}
.count b{font-size:30px;display:block}
.count span{font-size:13px;color:var(--ink2)}
.content{padding:clamp(18px,3vw,36px);padding-bottom:calc(clamp(18px,3vw,36px) + 20px);width:100%;max-width:1180px}
.h1{font-size:clamp(26px,3vw,34px);line-height:1.1;margin:0}
.lead{margin:6px 0 0;color:var(--ink2)}
.tabs{display:none}

/* check-in */
.ci{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.searchbox{position:relative}
.searchbox input{min-height:64px;font-size:21px;padding:12px 56px 12px 52px;border:2px solid var(--ink);border-radius:14px}
.searchbox svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none}
.searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:22px;color:var(--ink2)}
.searchbox .clr:hover{background:var(--soft)}
.hint{font-size:13px;color:var(--ink2);margin:8px 4px 0}
.results{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.res{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 12px 12px 14px;border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer}
.res:hover{border-color:var(--ink2)}
.res.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.res.here{background:var(--soft)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--soft2)}
.res.here .av{background:var(--ink);color:var(--bg)}
.res.here .av::after{content:"";width:15px;height:8px;border-left:3px solid var(--bg);border-bottom:3px solid var(--bg);transform:rotate(-45deg) translate(1px,-2px)}
.res .nm{font-size:18px;font-weight:700;line-height:1.25}
.res .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:14px;color:var(--ink2)}
.res .act{display:flex;align-items:center;gap:6px}
.res .when{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.tick{width:20px;height:20px;border-radius:50%;background:var(--ink);display:inline-grid;place-items:center}
.tick::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--bg);border-bottom:2.5px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.arrived{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--bg);margin-top:14px}
.arrived .big{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.arrived .big::after{content:"";width:20px;height:11px;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(-45deg) translate(2px,-2px)}
.arrived .nm{font-size:20px;font-weight:800;line-height:1.2}
.arrived .go{font-size:15px;opacity:.85;margin-top:2px}
.arrived .go b{opacity:1}
.arrived .btn{border-color:color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.arrived{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(-6px);opacity:0}}}
.add{border:1.5px dashed var(--ink2);border-radius:var(--r);padding:16px;margin-top:14px}
.add h3{margin:0 0 4px;font-size:17px}
.add form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;margin-top:12px}
.panel{position:sticky;top:96px}
.panel h3{font-size:15px;margin:0 0 10px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.feed .who{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .where{font-size:13px;color:var(--ink2);grid-column:1}
.feed .t{grid-row:1/span 2;grid-column:2;text-align:right;font-size:13px;color:var(--ink2)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:end;margin-bottom:22px}
.stat b{font-size:48px;line-height:.9}

/* live */
.kpis{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}
.kpi{padding:18px;border-radius:var(--r);background:var(--soft)}
.kpi.main{background:var(--ink);color:var(--bg)}
.kpi b{display:block;font-size:clamp(30px,4vw,44px);line-height:1}
.kpi span{font-size:14px;opacity:.8}
.kpi .bar{margin-top:14px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.kpi .bar i{background:var(--bg)}
.glist{display:grid;gap:10px;margin-top:18px}
.g{border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.gh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 92px 22px;gap:16px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.gh:hover{background:var(--soft)}
.gh>span,.uh>span{display:block;min-width:0}.gh .hd,.uh .hd{display:block;margin-top:1px}
.gh .gn{font-weight:800;font-size:18px}
.gh .hd,.uh .hd{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .ct{text-align:right;font-size:15px}
.gh .ct b{font-size:20px}
.chev{width:9px;height:9px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);justify-self:center;transition:transform .15s}
.open>.gh .chev,.open>.uh .chev{transform:rotate(45deg)}
.units{border-top:1.5px solid var(--line);background:var(--soft)}
.u{border-bottom:1px solid var(--line)}.u:last-child{border:0}
.uh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 92px 22px;gap:16px;align-items:center;padding:12px 16px 12px 28px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.uh:hover{background:var(--soft2)}
.uh .gn{font-weight:700}
.ppl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;padding:4px 16px 16px 28px}
.ppl h4{margin:10px 0 4px;font-size:13px;color:var(--ink2);font-weight:650}
.ppl ul{list-style:none;margin:0;padding:0}
.ppl li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.ppl .no{color:var(--red)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.abs h3{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 2px;font-size:20px;padding-top:12px;border-top:2px solid var(--ink)}
.abs .lead2{font-size:14px;color:var(--ink2);margin-bottom:6px}
.abs ul{list-style:none;padding:0;margin:0;columns:2 300px;column-gap:32px}
.abs li{break-inside:avoid;display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}

/* people */
.filters{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:10px;margin-top:18px}
.plist{list-style:none;margin:14px 0 0;padding:0;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.plist li{display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.plist li:last-child{border:0}
.plist li:hover{background:var(--soft)}
.plist .av{width:40px;height:40px;font-size:14px}
.plist .nm{font-weight:650}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:18px}
.gc{padding:16px;display:grid;gap:10px;align-content:start}
.gc h3{margin:0;font-size:19px}
.gc ul{list-style:none;margin:0;padding:0;font-size:14px}
.gc li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}

/* meetings */
.mgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:22px;align-items:start}
.mcard{padding:20px}
.mcard h2{margin:0 0 4px;font-size:22px}
.mtable{width:100%;border-collapse:collapse;font-size:15px}
.mtable td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtable tr:last-child td{border:0}

/* sheet */
.scrim{position:fixed;inset:0;background:#0007;z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);border-radius:18px;width:min(560px,100%);max-height:min(88dvh,820px);overflow:auto;padding:22px;box-shadow:0 20px 60px #0005}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet .x{float:right;width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);cursor:pointer;font-size:20px;margin:-6px -6px 0 0}
.sheet .foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:22px}
.sheet .foot .left{margin-right:auto}
.mlist{list-style:none;margin:10px 0 0;padding:0}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.scrim{animation:fade .15s}.sheet{animation:up .2s ease-out}@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 12px 12px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:40;box-shadow:0 10px 30px #0004;max-width:calc(100vw - 24px)}
.toast button{border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);background:none;color:var(--bg);border-radius:8px;min-height:36px;padding:4px 12px;font-weight:650;cursor:pointer}

/* login */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:40px;padding:clamp(24px,6vw,80px);max-width:1200px;margin:auto}
.login form{display:grid;gap:14px;max-width:420px}
.login svg{width:100%;height:auto}

@media (max-width:1100px){.ci{grid-template-columns:minmax(0,1fr)}.panel{position:static}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.main{grid-column:1/-1}.mgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1.5px solid var(--line);padding-bottom:var(--safe-b)}
  .tabs a{display:grid;justify-items:center;gap:2px;padding:9px 4px 10px;text-decoration:none;font-size:12.5px;font-weight:650;color:var(--ink2);position:relative}
  .tabs a b{font-size:15px;color:inherit}
  .tabs a[aria-current]{color:var(--ink)}
  .tabs a[aria-current]::before{content:"";position:absolute;top:-1.5px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
  .content{padding-bottom:calc(96px + var(--safe-b))}
  .toast{bottom:calc(84px + var(--safe-b))}
  .top{min-height:64px;padding-block:8px}
  .count b{font-size:24px}
  .scrim{place-items:end stretch;padding:0}
  .sheet{border-radius:20px 20px 0 0;width:100%;max-height:92dvh;padding-bottom:calc(22px + var(--safe-b))}
  .login{grid-template-columns:minmax(0,1fr)}.login svg{order:-1;max-width:340px}
}
@media (max-width:600px){
  .searchbox input{min-height:58px;font-size:19px}
  .res{grid-template-columns:minmax(0,1fr) auto;padding:12px}
  .res .av{display:none}
  .res .nm{font-size:17px}
  .add form{grid-template-columns:minmax(0,1fr)}
  .arrived{grid-template-columns:auto minmax(0,1fr)}.arrived .btn{grid-column:1/-1}
  .gh,.uh{grid-template-columns:minmax(0,1fr) 84px 18px}.gh .hdw,.uh .hdw{display:none}
  .gh .hd2{display:block}
  .ppl{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .btn{grid-column:1/-1}
  .plist li{grid-template-columns:minmax(0,1fr) auto}.plist .av,.plist .gcol{display:none}
  .kpi b{font-size:30px}
  .meet .t{font-size:16px;max-width:52vw}
}
.gh .hd2,.uh .hd2{display:none}
@media (max-width:600px){.gh .hd2,.uh .hd2{display:block}}
@media print{.side,.tabs,.top,.toolbar,.toast,.seg,.btn{display:none!important}.app{display:block}.content{padding:0}.abs ul{columns:2}body{font-size:12px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="person"><ellipse cx="0" cy="96" rx="30" ry="6" fill="currentColor" opacity=".12"/><path d="M-26 92 C-26 52 -16 40 0 40 C16 40 26 52 26 92 Z"/><circle cx="0" cy="22" r="15"/><path d="M-9 14 A12 12 0 0 1 12 12" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/></g>
</defs></svg>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', year:'numeric'}) : '';
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const byName = (a,b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
let canWrite = true, ready = false, downloads = true;
const S = {members:{}, groups:{}, meetings:{}, current:null};
const store = {get(k,d){ try { const v = localStorage.getItem('ccrw.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem('ccrw.'+k, JSON.stringify(v)); } catch(e){} }};
let pass = store.get('pass', ''), queue = store.get('queue', []), cursor = 0, online = true;
{ const c = store.get('cache', null); if (c && pass) { Object.assign(S, c.S); cursor = c.cursor || 0; ready = true; } }
const persist = () => { store.set('queue', queue); store.set('cache', {S, cursor}); };

/* ---------- server sync ---------- */
// On Cloudflare (or locally) the API lives on the same site. Any other host, such as Vercel, calls the Worker directly.
const WORKER = 'https://ccrw.jonmidas27.workers.dev';
const API = /\.workers\.dev$|^localhost$|^127\./.test(location.hostname) ? '/api' : WORKER + '/api';
async function api(path, opts = {}){
  const r = await fetch(API + path, {...opts, headers:{'content-type':'application/json', 'x-passcode': pass}});
  const body = await r.json().catch(()=>({}));
  if (r.status === 401 || r.status === 429) throw {auth:true, msg: body.error || 'Wrong passcode.'};
  if (!r.ok) throw new Error(body.error || 'Request failed');
  return body;
}
function setOnline(v){ online = v; syncBadge(); }
function syncBadge(){
  const st = !online ? 'off' : queue.length ? 'busy' : '';
  const txt = !online ? `Offline${queue.length?` · ${queue.length} waiting`:''}` : queue.length ? 'Saving…' : 'All changes saved';
  document.querySelectorAll('.syncslot').forEach(el => { el.innerHTML = `<span class="dot ${st}"></span><span>${txt}</span>`; el.title = txt; });
}
function enqueue(op){ queue.push(op); persist(); syncBadge(); flush(); }
let flushing = false;
async function flush(){
  if (flushing || !queue.length || !pass) return; flushing = true;
  try { while (queue.length) { const batch = queue.slice(0, 400); await api('/ops', {method:'POST', body: JSON.stringify({ops: batch})}); queue.splice(0, batch.length); persist(); } setOnline(true); }
  catch(e){ if (e.auth) lock(e.msg); else setOnline(false); }
  finally { flushing = false; syncBadge(); }
}
function apply(d){
  let changed = false;
  for (const g of d.groups) { changed = true; if (g.deleted) delete S.groups[g.id]; else S.groups[g.id] = {id:g.id, name:g.name, parent:g.parent||''}; }
  for (const m of d.members) { changed = true; if (m.deleted) delete S.members[m.id]; else S.members[m.id] = {id:m.id, name:m.name, phone:m.phone||'', group:m.group||'', subgroup:m.subgroup||'', role:m.role||'member'}; }
  for (const m of d.meetings) { changed = true; if (m.deleted) delete S.meetings[m.id]; else S.meetings[m.id] = {...(S.meetings[m.id]||{present:{}}), title:m.title, date:m.date, createdAt:m.createdAt, endedAt:m.endedAt||null, totalAtEnd:m.totalAtEnd||null}; }
  for (const c of d.checkins) { changed = true; const mt = S.meetings[c.meeting] ||= {present:{}, title:'', date:''}; mt.present = {...mt.present, [c.member]: c.deleted ? null : c.at}; }
  const cur = d.current || null; if (cur !== S.current) { S.current = cur; changed = true; }
  return changed;
}
let pulling = false;
async function pull(){
  if (pulling || !pass) return; pulling = true;
  try { await flush(); if (queue.length) return; const d = await api('/sync?since=' + cursor); const first = !ready; const changed = apply(d); cursor = d.now; ready = true; state.msg = ''; setOnline(true); persist(); if (changed || first) softRender(); }
  catch(e){ if (e.auth) lock(e.msg); else { setOnline(false); if (!ready) { state.msg = "Can't reach the register — check the internet connection. It will retry by itself."; render(); } } }
  finally { pulling = false; }
}
function lock(msg){ pass = ''; store.set('pass', ''); store.set('cache', null); state.loginMsg = msg || ''; render(); }
// Don't wipe a half-typed form when another desk's update arrives.
let pendingRender = false;
function softRender(){
  const a = document.activeElement;
  if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.id !== 'q' && a.id !== 'pq') { pendingRender = true; render(true); return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (pendingRender && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) { pendingRender = false; render(); } }, 250));

const saveMember = m => enqueue({t:'member', op:'put', data:m});
const dropMember = id => enqueue({t:'member', op:'del', data:{id}});
const saveGroup = g => enqueue({t:'group', op:'put', data:g});
const dropGroup = id => enqueue({t:'group', op:'del', data:{id}});
const setCurrent = id => { S.current = id; enqueue({t:'current', op:'put', data:{id: id || ''}}); };
const saveMeeting = id => { const m = S.meetings[id]; enqueue({t:'meeting', op:'put', data:{id, title:m.title, date:m.date, createdAt:m.createdAt, endedAt:m.endedAt||null, totalAtEnd:m.totalAtEnd||null}}); };


/* ---------- derived ---------- */

const members = () => Object.values(S.members).sort(byName);
const isUnp = g => norm(g.name) === norm(UNPAIRED);
const groupsTop = () => Object.values(S.groups).filter(g => !g.parent).sort((a,b) => (isUnp(a)-isUnp(b)) || byName(a,b));
const subsOf = gid => Object.values(S.groups).filter(g => g.parent === gid).sort(byName);
const gName = id => S.groups[id]?.name || '';
const meeting = () => S.meetings[S.current] || null;
const presentMap = m => { const out = {}; if (m) for (const [k,v] of Object.entries(m.present||{})) if (v && S.members[k]) out[k] = v; return out; };
const inGroup = (gid) => members().filter(m => m.group === gid);
const headOf = (gid, role) => Object.values(S.members).find(m => m.role === role && (role === 'group_head' ? m.group === gid : m.subgroup === gid));
const where = p => S.groups[p.group] ? (isUnp(S.groups[p.group]) ? UNPAIRED : [gName(p.group), S.groups[p.subgroup] ? unitLabel(p.subgroup) : ''].filter(Boolean).join(' · ')) : UNPAIRED;
// "Group 4B" under "Group 4" reads as "Unit 4B"
const unitLabel = id => { const u = S.groups[id]; if (!u) return ''; const g = S.groups[u.parent]; return g && /^group\s/i.test(u.name) && u.name.startsWith(g.name) && u.name.length > g.name.length ? 'Unit ' + u.name.replace(/^group\s*/i, '') : u.name; };
const initials = n => (n.replace(/^(pst|pastor|rev|reverend|apst|apstl|apostle|ap|evang|evangelist|mrs|mr|dr|prof|hon|sis|bro|elder|eld|min|minister|deac|barr|prophet)\.?\s+/i,'').match(/\p{L}/gu) || ['?']).slice(0,1).concat((n.split(/\s+/).slice(-1)[0].match(/\p{L}/u)||[''])).join('').toUpperCase().slice(0,2);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const pctTxt = (a,b) => a && pct(a,b) === 0 ? '<1' : String(pct(a,b));
const ROLE_LABEL = {group_head:'Group head', subgroup_head:'Unit head', assistant_head:'Assistant unit head', member:'Member'};
const roleChip = r => r && r !== 'member' ? `<span class="chip head">${ROLE_LABEL[r]}</span>` : '';
const isPhoneQ = q => /^\+?[\d\s-]{6,}$/.test(q.trim());
const titleCase = s => s.trim().replace(/\s+/g,' ').replace(/(^|[\s\-'])(\p{L})/gu, (a,b,c) => b + c.toUpperCase());
const UNPAIRED = 'Not paired yet';

function search(q){
  const toks = norm(q).split(/\s+/).filter(Boolean); if (!toks.length) return [];
  const digits = q.replace(/\D/g,'');
  const out = [];
  for (const m of Object.values(S.members)) {
    const n = norm(m.name), words = n.split(/[\s\-',.()]+/);
    let ok = toks.every(t => words.some(w => w.startsWith(t)) || n.includes(t));
    if (!ok && digits.length >= 4) ok = (m.phone||'').replace(/\D/g,'').includes(digits.replace(/^0/, '')) ;
    if (ok) out.push([words.some(w => w.startsWith(toks[0])) ? 0 : 1, m]);
  }
  return out.sort((a,b) => a[0]-b[0] || byName(a[1], b[1])).slice(0, 30).map(x => x[1]);
}

/* ---------- import ---------- */
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){ const c = text[i];
    if (q) { if (c==='"' && text[i+1]==='"') { cell+='"'; i++; } else if (c==='"') q=false; else cell+=c; }
    else if (c==='"') q=true; else if (c===','||c===';'||c==='\t') { row.push(cell); cell=''; }
    else if (c==='\n'||c==='\r') { if (c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function loadXlsx(){
  return new Promise((ok, bad) => { if (window.XLSX) return ok(window.XLSX);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => ok(window.XLSX); s.onerror = bad; document.head.appendChild(s); });
}
async function readFile(file){
  let grid;
  if (/\.xlsx?$/i.test(file.name)) { const X = await loadXlsx(); const wb = X.read(await file.arrayBuffer()); grid = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''}); }
  else grid = parseCsv(await file.text());
  grid = grid.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  // the header row is the first row that names a "name" column
  const hi = grid.findIndex(r => r.some(c => /name/i.test(c)));
  if (hi < 0 || grid.length - hi < 2) throw new Error('noname');
  grid = grid.slice(hi);
  const H = grid[0].map(norm), find = (...tests) => H.findIndex(h => tests.some(t => t(h)));
  const has = w => h => h.includes(w);
  const iFirst = find(h => /first ?name|given/.test(h)), iLast = find(h => /(last|sur) ?name|family/.test(h));
  const iName = find(h => h==='name'||h==='full name'||h==='names', h => h.includes('name') && !/first|last|sur|group/.test(h));
  const iPhone = find(has('phone'), has('mobile'), has('tel'), has('contact'), has('whatsapp'));
  const iSub = find(h => /sub ?-?group|subgroup/.test(h), has('cell'), has('unit'), has('sub'));
  const iGroup = find(h => !/sub|status/.test(h) && /group|department|dept|team|zone|ministry|fellowship/.test(h));
  const iRole = find(has('role'), has('position'), has('head'), has('leader'), has('title'));
  if (iName < 0 && iFirst < 0) throw new Error('noname');
  const rows = grid.slice(1).map(r => {
    const name = iName >= 0 ? r[iName] : [r[iFirst], iLast >= 0 ? r[iLast] : ''].filter(Boolean).join(' ');
    const role = norm(iRole >= 0 ? r[iRole] : '');
    return {name: name.replace(/\s+/g,' ').trim(), phone: iPhone >= 0 ? r[iPhone].replace(/^[—-]$/,'') : '', group: iGroup >= 0 ? r[iGroup] : '', subgroup: iSub >= 0 ? r[iSub] : '',
      role: /assist/.test(role) ? 'assistant_head' : /sub|unit/.test(role) && /head|leader|lead/.test(role) ? 'subgroup_head' : /head|leader|lead|coordinator/.test(role) ? 'group_head' : 'member'};
  }).filter(r => r.name && !/^(group|section)\b.*\(\d+/i.test(r.name));
  const digitsKey = s => String(s||'').replace(/\D/g,'').slice(-10);
  const key = r => norm(r.name) + '|' + digitsKey(r.phone);
  const havePhones = new Set(Object.values(S.members).flatMap(m => (m.phone||'').split(',').map(digitsKey).filter(p => p.length >= 10)));
  const have = new Set(Object.values(S.members).map(key));
  const seen = new Set(); let dupes = 0;
  for (const r of rows) { const k = key(r), pk = digitsKey(r.phone); r.dupe = have.has(k) || seen.has(k) || (pk.length >= 10 && havePhones.has(pk)); if (r.dupe) dupes++; seen.add(k); }
  const gNames = new Set(rows.filter(r => !r.dupe).map(r => norm(r.group)).filter(Boolean));
  const newGroups = [...gNames].filter(n => !groupsTop().some(g => norm(g.name) === n)).length;
  const cols = [['Name', iName >= 0 || iFirst >= 0], ['Phone', iPhone >= 0], ['Group', iGroup >= 0], ['Unit', iSub >= 0], ['Role', iRole >= 0]].filter(c => c[1]).map(c => c[0]).join(', ');
  return {file: file.name, rows, dupes, newGroups, cols};
}
function importSheet(imp){
  const fresh = imp.rows.length - imp.dupes;
  openSheet(`${sheetHead('Import ' + esc(imp.file), `Found ${imp.rows.length} people. Columns read: ${esc(imp.cols)}.`)}
    <ul class="mlist"><li><span>New people to add</span><b class="num">${fresh}</b></li><li><span>Already on the register (skipped)</span><b class="num">${imp.dupes}</b></li><li><span>New groups to create</span><b class="num">${imp.newGroups}</b></li></ul>
    <p class="muted small">Anyone without a group goes into “${UNPAIRED}”.</p>
    <div class="foot"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" id="okBtn" ${fresh ? '' : 'disabled'}>Import ${fresh}</button></div>`, '#okBtn');
  $('#okBtn').onclick = () => { closeSheet(); doImport(imp); };
}
function doImport(imp){
  const pending = [], added = [];
  for (const r of imp.rows) { if (r.dupe) continue;
    const g = findOrMakeGroup(r.group, '', pending), s = g ? findOrMakeGroup(r.subgroup, g, pending) : '';
    const m = {id: uid('m'), name: r.name, phone: r.phone, group: g || unpairedGroup(), subgroup: s, role: r.role};
    S.members[m.id] = m; added.push(m); }
  for (const g of pending) { S.groups[g.id] = g; saveGroup(g); }
  for (const m of added) saveMember(m);
  render(); toast(`Imported ${added.length} people.`);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.matches('[data-scrim]')) { closeSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'reg') register(id);
  else if (a === 'undo') unregister(id);
  else if (a === 'clearQ') { ui.q = ''; ui.sel = 0; const q = $('#q'); q.value = ''; q.focus(); renderCiBody(); }
  else if (a === 'meetingMenu') meetingSheet();
  else if (a === 'closeSheet') closeSheet();
  else if (a === 'reopen') { meeting().endedAt = null; saveMeeting(S.current); closeSheet(); render(); toast('Check-in reopened.'); }
  else if (a === 'end') { closeSheet(); endMeeting(); }
  else if (a === 'openM') { setCurrent(id); ui.last = null; closeSheet(); render(); toast(`Opened ${S.meetings[id].title}.`); }
  else if (a === 'delM') { const v = S.meetings[id]; confirmSheet(`Delete ${esc(v.title)}?`, `Its check-ins (${Object.keys(presentMap(v)).length}) are removed too. This can't be undone.`, 'Delete meeting', () => { enqueue({t:'meeting', op:'del', data:{id}}); if (S.current === id) setCurrent(null); delete S.meetings[id]; render(); }); }
  else if (a === 'liveTab') { ui.liveTab = b.dataset.v; render(); }
  else if (a === 'peopleTab') { ui.peopleTab = b.dataset.v; render(); }
  else if (a === 'toggleG') { ui.openG.has(id) ? ui.openG.delete(id) : ui.openG.add(id); render(); }
  else if (a === 'toggleU') { ui.openU.has(id) ? ui.openU.delete(id) : ui.openU.add(id); render(); }
  else if (a === 'print') window.print();
  else if (a === 'lock') confirmSheet('Lock this device?', 'Anyone using it will need the desk passcode again.', 'Lock', () => lock(''), false);
  else if (a === 'copyAbsent') { const t = absentList().filter(p => ui.absG === 'all' || p.group === ui.absG).map(p => [p.name, (p.phone||'').split(',')[0], where(p)].filter(Boolean).join(' — ')).join('\n');
    navigator.clipboard?.writeText(t).then(() => toast('Absent list copied.'), () => toast('Copy was blocked by the browser.')); }
  else if (a === 'dlAbsent') { const m = meeting(); saveFile(`absent-${slug(m.title)}-${m.date}.csv`, toCsv([['Name','Phone','Group','Unit','Group head'], ...absentList().filter(p => ui.absG === 'all' || p.group === ui.absG).map(p => [p.name, p.phone, gName(p.group), unitName(p), headOf(p.group,'group_head')?.name || ''])])); }
  else if (a === 'dlAll') { const m = meeting(), pres = presentMap(m); saveFile(`attendance-${slug(m.title)}-${m.date}.csv`, toCsv([['Name','Phone','Group','Unit','Role','Status','Time'], ...members().map(p => [p.name, p.phone, gName(p.group), unitName(p), ROLE_LABEL[p.role] || 'Member', pres[p.id] ? 'Present' : 'Absent', pres[p.id] ? fmtTime(pres[p.id]) : ''])])); }
  else if (a === 'dlRoster') saveFile('ccrw-register.csv', toCsv([['Name','Phone','Group','Unit','Role'], ...members().map(p => [p.name, p.phone, gName(p.group), unitName(p), ROLE_LABEL[p.role] || 'Member'])]));
  else if (a === 'tpl') saveFile('rollcall-template.csv', toCsv([['Name','Phone','Group','Subgroup','Role'],['Ada Obi','08031234567','Group 1','Group 1A','Unit head'],['Tunde Bello','08039876543','Group 1','Group 1B','Member'],['Ngozi Eze','','','','Member']]));
  else if (a === 'pick') $('#file').click();
  else if (a === 'addP') personSheet();
  else if (a === 'editP') personSheet(id);
  else if (a === 'more') { ui.plimit += 120; renderPlist(); }
  else if (a === 'delP') { const p = S.members[id]; confirmSheet(`Remove ${esc(p.name)}?`, 'They come off the register and every check-in list.', 'Remove', () => { delete S.members[id]; dropMember(id); render(); toast(`${p.name} removed.`); }); }
  else if (a === 'addG') groupSheet();
  else if (a === 'editG') groupSheet(id);
  else if (a === 'addUnit') { const f = $('#gform'), v = f.newUnit.value.trim(); if (!v) return; const u = {id: uid('g'), name: v, parent: f.dataset.id}; S.groups[u.id] = u; saveGroup(u); groupSheet(f.dataset.id); }
  else if (a === 'delG') { const g = S.groups[id]; confirmSheet(`Delete ${esc(g.name)}?`, 'Its units are deleted too.', 'Delete group', () => { for (const u of subsOf(id)) { delete S.groups[u.id]; dropGroup(u.id); } delete S.groups[id]; dropGroup(id); render(); }); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheetHost').innerHTML) { closeSheet(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  if (e.target.id !== 'q') return;
  const res = search(ui.q);
  if (e.key === 'ArrowDown') { ui.sel = Math.min(ui.sel + 1, res.length - 1); renderCiBody(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { ui.sel = Math.max(ui.sel - 1, 0); renderCiBody(); e.preventDefault(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (res[ui.sel]) register(res[ui.sel].id); }
  else if (e.key === 'Escape') { ui.q = ''; e.target.value = ''; renderCiBody(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; ui.sel = 0; if (ui.q) ui.last = null; renderCiBody(); }
  else if (t.id === 'pq') { ui.pq = t.value; ui.plimit = 120; renderPlist(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'file' && t.files[0]) { try { importSheet(await readFile(t.files[0])); } catch(err) { toast(err.message === 'noname' ? 'Could not find a Name column in that file.' : 'Could not read that file.'); } t.value = ''; }
  else if (t.id === 'pf') { ui.pf = t.value; ui.plimit = 120; renderPlist(); }
  else if (t.id === 'absG') { ui.absG = t.value; render(); }
  else if (t.id === 'pfGroup') $('#pfUnit').innerHTML = unitOptions(t.value, '');
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'login') { pass = $('#pc').value.trim(); state.loginMsg = ''; const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Checking…';
    api('/login').then(() => { store.set('pass', pass); ready = false; cursor = 0; S.members = {}; S.groups = {}; S.meetings = {}; S.current = null; render(); pull(); })
      .catch(err => { pass = ''; state.loginMsg = err.auth ? err.msg : "Can't reach the server. Check the internet connection."; render(); }); }
  else if (/^newMeeting/.test(f.id)) startMeeting(f.title.value, f.date.value || today());
  else if (f.id === 'quickAdd') quickAdd(f.name.value, f.phone.value);
  else if (f.id === 'changePass') { const v = f.np.value.trim(); api('/passcode', {method:'POST', body: JSON.stringify({passcode: v})}).then(() => { pass = v; store.set('pass', v); f.reset(); toast('Passcode changed. Other desks will need the new one.'); }).catch(err => toast(err.msg || err.message || 'Could not change the passcode.')); }
  else if (f.id === 'pform') {
    const id = f.dataset.id, isNew = !S.members[id];
    const m = {id, name: f.name.value.trim(), phone: f.phone.value.trim(), group: f.group.value || unpairedGroup(), subgroup: f.group.value ? f.subgroup.value : '', role: f.role.value};
    if (!m.name) return;
    S.members[id] = m; saveMember(m);
    if (m.role === 'group_head') setHead(m.group, 'group_head', id); else if (m.role === 'subgroup_head' && m.subgroup) setHead(m.subgroup, 'subgroup_head', id);
    closeSheet(); render(); toast(isNew ? `Added ${m.name}.` : `Saved ${m.name}.`);
  }
  else if (f.id === 'gform') {
    const gid = f.dataset.id, name = f.name.value.trim(); if (!name) return;
    if (!gid) { const g = {id: uid('g'), name, parent: ''}; S.groups[g.id] = g; saveGroup(g); closeSheet(); render(); groupSheet(g.id); return; }
    const g = S.groups[gid]; if (g.name !== name) { g.name = name; saveGroup(g); }
    setHead(gid, 'group_head', f.head.value);
    for (const u of subsOf(gid)) { const nn = f['u_' + u.id].value.trim(); if (nn && nn !== u.name) { u.name = nn; saveGroup(u); } setHead(u.id, 'subgroup_head', f['h_' + u.id].value); }
    const nu = f.newUnit.value.trim(); if (nu) { const u = {id: uid('g'), name: nu, parent: gid}; S.groups[u.id] = u; saveGroup(u); }
    closeSheet(); render(); toast(`Saved ${name}.`);
  }
});
window.addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

/* ---------- start ---------- */
render();
pull();
setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 3000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
window.addEventListener('online', pull);
}
</script>
